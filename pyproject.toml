# pyproject.toml

[project]
name = "organize"
version = "0.1.0"
description = "Sistema de organização de tarefas e rotinas"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["organize*"]
